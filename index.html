<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SignAI — Real-time ASL Sign Language Translator. Translate sign language gestures into text using your camera. Private, on-device AI." />
  <meta name="theme-color" content="#03040a" />

  <!-- Open Graph -->
  <meta property="og:title" content="SignAI — AI Sign Language Translator" />
  <meta property="og:description" content="Translate ASL signs into text in real time. No data leaves your device." />
  <meta property="og:type" content="website" />

  <title>SignAI — AI Sign Language Translator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤟</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <!-- Three.js 3D Background Canvas -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- React Root -->
  <div id="root"></div>

  <!-- ═══════════════════════════════════════════════
       EXTERNAL LIBRARIES
       ═══════════════════════════════════════════════ -->

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (JSX transform in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <!-- ═══════════════════════════════════════════════
       APP SCRIPTS (order matters)
       ═══════════════════════════════════════════════ -->

  <!-- Sign language database -->
  <script src="js/signs-data.js"></script>

  <!-- Gesture classifier (must load after signs-data) -->
  <script src="js/classifier.js"></script>

  <!-- Three.js animated background (runs after DOM ready) -->
  <script src="js/background.js"></script>

  <!-- Main React app (JSX — transpiled by Babel) -->
  <script type="text/babel" src="js/app.js"></script>

</body>
</html>
